[project]
name = "kiadopt"
version = "0.1.1"
description = "Copy parts from any KiCad 10 library into the project library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nikita Sivakov" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Repository = "https://github.com/sivakov512/kiadopt"

[project.scripts]
kiadopt = "kiadopt.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
kiadopt = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not kicad'"
markers = ["kicad: integration tests that need kicad-cli"]

[tool.coverage.run]
source = ["kiadopt"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
