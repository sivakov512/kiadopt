name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          # A PAT, not the runner's token: a release cut with GITHUB_TOKEN
          # couldn't trigger the Release build workflow.
          token: ${{ secrets.RELEASER_TOKEN }}
          config-file: .release-please/config.json
          manifest-file: .release-please/manifest.json
